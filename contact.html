<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Jeroen Brianraj Portfolio</title>
    <link rel="icon" href="" />
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link rel="stylesheet" href="style-contact.css" />
  </head>
  <body>
    <div class="bg-image"></div>

    <div class="menu">
      <div class="name">
        <p class="nm">Jeroen Brianraj</p>
      </div>
      <div class="menu-left">
        <a class="menu-ob-1" href="index.html">About</a>
        <a class="menu-ob-2" href="projects.html">Projects</a>
        <a class="menu-ob-3" href="documentations.html">Documentations</a>
        <a class="menu-ob-4" href="contact.html">Contact</a>
      </div>

      <div class="mode">
        <div class="light">
          <img src="light-mode-removebg-preview.png" alt="" />
        </div>
        <div class="switch">
          <input type="checkbox" />
        </div>
        <div class="dark">
          <img src="dark-mode.png" alt="" />
        </div>
      </div>
    </div>
    <div class="contact">
      <h1>You can reach out to me via:</h1>
      <div class="details">
        <div class="details-info">
          <div class="phone-no">
            <h2>Phone:</h2>
            <div class="info-cont">
              <img src="phone-logo.png" alt="" />
              <p>+91 7204777163</p>
            </div>
          </div>
          <div class="email">
            <h2>Email:</h2>
            <div class="info-cont">
              <img src="gmail-logo.png" alt="" />
              <p>jerrybrian105@gmail.com</p>
            </div>
          </div>
          <div class="twitter">
            <h2>Twitter:</h2>
            <div class="twt">
              <img src="twitter-logo.jpg" alt="" />
              <a href="">Jeroen B</a>
            </div>
          </div>
          <div class="github">
            <h2>GitHub</h2>
            <div class="info-cont">
              <img src="git-hub.png" alt="" />
              <div class="git">
                <a href="https://github.com/Jeroen-Brian">Jeroen-Brian</a>
              </div>
            </div>
          </div>
        </div>
        <div class="contact-img">
          <img src="contact-img.png" alt="" />
        </div>
      </div>
      <form
        class="message"
        action="https://formsubmit.co/jerrybrian105@gmail.com"
        method="POST"
      >
        <h2 class="m-tl">Or you can send me a message here:</h2>
        <div class="r-name">
          <div class="f-name">
            <label>First Name :</label>
            <input
              type="text"
              name="first-name"
              required
              oninvalid="this.setCustomValidity('Please enter your First Name here')"
              oninput="this.setCustomValidity('')"
            />
          </div>
          <div class="l-name">
            <label>Last Name :</label>
            <input
              type="text"
              name="last-name"
              required
              oninvalid="this.setCustomValidity('Please enter your Last Name here')"
              oninput="this.setCustomValidity('')"
            />
          </div>
        </div>
        <div class="email-phone">
          <div class="m-email">
            <label>Email :</label>
            <input
              type="email"
              name="email"
              required
              oninvalid="this.setCustomValidity('Please enter your Email here')"
              oninput="this.setCustomValidity('')"
            />
          </div>
          <div class="m-phone">
            <label>Phone Number:</label>
            <input
              type="number"
              name="phone"
              required
              oninvalid="this.setCustomValidity('Please enter your Phone Number here')"
              oninput="this.setCustomValidity('')"
            />
          </div>
        </div>
        <div class="text-msg">
          <label>Type your message below:</label>
          <textarea
            name="message"
            required
            oninvalid="this.setCustomValidity('Please type your message here')"
            oninput="this.setCustomValidity('')"
          ></textarea>
        </div>
        <div class="tc">
          <input
            type="checkbox"
            required
            oninvalid="this.setCustomValidity('Please agree to the terms and conditions')"
            oninput="this.setCustomValidity('')"
          />
          <label>I accept the terms and conditions</label>
        </div>
        <button type="submit">Send</button>
      </form>
    </div>
  </body>
</html>
